name: Verify homepage
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check personalized pages
        shell: bash
        run: |
          test -s _site/index.html
          test -s _site/cv/index.html
          test -s _site/research/index.html
          test -s _site/publications/index.html
          test -s _site/contact/index.html
          grep -q 'Junteng Liu' _site/index.html
          grep -q 'SynLogic' _site/publications/index.html
          grep -q 'jliugi@connect.ust.hk' _site/contact/index.html
          grep -q '/LJT-Homepage/publications/' _site/index.html
          test ! -e _site/markdown/index.html
